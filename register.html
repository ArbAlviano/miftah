<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="karep.css">
</head>
<body>
    <form action="webmiftah.html">
        <fieldset class="container">
            <div class="left-side">
                <img src="image/Faridz.jpeg" alt="Register Image">
            </div>
            <div class="right-side">
                <a href="" class="link">Need Help?</a>
                <h2>Create Account</h2>
                <p>
                    <label for="username"></label>
                    <input type="text" name="username" placeholder="Full Name">
                </p>
                <p>
                    <label for="password"></label>
                    <input type="password" name="password" placeholder="Password">
                </p>
                <p>
                    <label for="E-mail"></label>
                    <input type="email" name="email" placeholder="E-mail">
                </p>
                    <label>
                    <input type="checkbox" name="remember" value="remember"/>I accept the terms off the aggrement
                    </label>
                <p>
                    <input type="submit" name="submit" value="Login">
                </p>
                <p>
                    Privacy Policy_Terms & Conditions
                </p>
            </div>
        </fieldset>
    </form>
    
</body>
</html>
